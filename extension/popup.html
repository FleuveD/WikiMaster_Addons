<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wikimaster Auto-Opener</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <div class="header-left">
        <img src="assets/icon48.png" alt="Logo" class="logo">
        <div class="header-titles">
          <h1>WikiMaster Addons</h1>
          <span class="subtitle">Quality of Life addons for WikiMaster</span>
        </div>
      </div>
      <div class="header-right">
        <button id="toggle-debug-btn" class="icon-btn" title="Afficher/Masquer la console">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </button>
        <button id="clear-btn" class="icon-btn" title="Vider l'historique">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat"><span id="total-cards">0</span> Cartes</div>
    </div>

    <div id="card-list" class="card-list">
      <!-- Les cartes seront injectées ici via JS -->
      <div class="empty-state">Aucune carte trouvée. Allez ouvrir des packs !</div>
    </div>

    <div id="debug-logs" class="debug-logs hidden">
      <div class="logs-header">
        Console Extension
        <button id="copy-logs-btn" class="copy-logs">Copier</button>
      </div>
      <div id="logs-content" class="logs-content"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
